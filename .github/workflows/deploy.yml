name: deploy

# Continuous deployment to Hugging Face Spaces, gated by evaluation: this runs only after the
# eval-gate workflow has PASSED on main. A commit that fails the gate is never deployed.
# Rollback = revert the commit on main; the revert passes the gate and redeploys the previous version.

on:
  workflow_run:
    workflows: [eval-gate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}           # e.g. "your-hf-username/vllm-docs-rag"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check deployment settings
        id: settings
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::notice::HF_TOKEN secret or HF_SPACE variable not set, skipping deployment"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            # Spaces are served at https://<owner>-<name>.hf.space (lowercase, '_' and '.' become '-')
            echo "url=https://$(echo "$HF_SPACE" | tr '/' '-' | tr '[:upper:]_.' '[:lower:]--').hf.space" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.settings.outputs.enabled == 'true'
        with:
          python-version: "3.12"

      - name: Expected config version
        if: steps.settings.outputs.enabled == 'true'
        id: expected
        run: |
          pip install -q pyyaml python-dotenv
          echo "config_hash=$(PYTHONPATH=src python -c 'from rag.config import load_config; print(load_config()["config_hash"])')" >> "$GITHUB_OUTPUT"

      # The Space only needs what the Docker image is built from; screenshots and other binaries
      # are left out (Spaces reject binary files that are not stored with Git LFS/Xet).
      - name: Push to the Space
        if: steps.settings.outputs.enabled == 'true'
        run: |
          mkdir "$RUNNER_TEMP/space"
          cp -r Dockerfile .dockerignore requirements.txt config prompts data src "$RUNNER_TEMP/space/"
          cp deploy/hf-space/README.md "$RUNNER_TEMP/space/README.md"
          cd "$RUNNER_TEMP/space"
          git init -q -b main
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} (config ${{ steps.expected.outputs.config_hash }})"
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main

      # Rollout verification: wait until the live app reports the config version we just shipped.
      - name: Verify the live app serves this version
        if: steps.settings.outputs.enabled == 'true'
        run: |
          url="${{ steps.settings.outputs.url }}"
          expected="${{ steps.expected.outputs.config_hash }}"
          for attempt in $(seq 1 60); do
            served=$(curl -fsS --max-time 10 "$url/health" | python -c 'import sys, json; print(json.load(sys.stdin)["config_hash"])' 2>/dev/null || true)
            if [ "$served" = "$expected" ]; then
              echo "Live at $url serving config $served"
              echo "Deployed config \`$served\` to $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: serving '${served:-not up yet}', waiting for $expected"
            sleep 20
          done
          echo "::error::$url did not start serving config $expected within 20 minutes"
          exit 1
